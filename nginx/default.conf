# Rate limiting zone definition
limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name rubizockt.de www.rubizockt.de;

    return 301 https://$host$request_uri;
}

# HTTPS server block
server {
    listen 443 ssl;
    server_name rubizockt.de www.rubizockt.de;
    root /var/www/html;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # HTTP security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;  # fixed this line

    # PHP handling
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/$fastcgi_script_name;
    }

    # Cache static files
    location ~* \.(jpg|jpeg|gif|css|png|js|ico|html)$ {
        expires max;
        log_not_found off;
    }

    # Block access to sensitive paths (e.g., boaform exploit attempts)
    location ~* /boaform/ {
        return 403;
    }

    # Stricter rate limiting for login pages
    location /login {
        limit_req zone=mylimit burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # Location for Shoutcast stream with CORS enabled
    location /stream {
        add_header 'Access-Control-Allow-Origin' '*';
        proxy_pass http://82.145.63.6:5739/stream;
        proxy_set_header Host $host;
    }
    
    # CORS Header für /js/ setzen
    location /js/ {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept';
        
        # Preflight-Anfragen für /js/ behandeln
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        # Ensure the file is served correctly
        try_files $uri $uri/ =404;
    }
    
    # Block specific IPs with suspicious behavior
    deny 154.213.184.25;
    deny 103.208.233.99;
    deny 185.224.128.59;

    # Log rate-limited requests (optional, for monitoring)
    error_log /var/log/nginx/rate_limited.log warn;
}
