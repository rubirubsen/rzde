    <script>
        
        function flipPage(pageIndex) {
            const pages = document.querySelectorAll('.page');
            const isFlippingForward = !pages[pageIndex].classList.contains('flipped');
            
            // Transition für Z-Index setzen
            for (let i = 0; i < pages.length; i++) {
                if (isFlippingForward) {
                    pages[i].style.transition = 'transform 1s ease, z-index 0s linear';
                } else {
                    pages[i].style.transition = 'transform 1s ease, z-index 0s linear 0.2s';
                }
            }
            
            pages[pageIndex].classList.toggle('flipped');
            
            // Z-Index dynamisch anpassen
            for (let i = 0; i < pages.length; i++) {
                if (isFlippingForward) {
                    setTimeout(()=> {
                        if (pages[i].classList.contains('flipped')) {
                            pages[i].style.zIndex = 12 + i;
                        } else {
                            pages[i].style.zIndex = 13 - i;
                        }
                    },350)                    
                } else {
                    // Rückwärtsblättern: Mit Verzögerung
                    setTimeout(() => {
                        if (pages[i].classList.contains('flipped')) {
                            pages[i].style.zIndex = 12 + i;
                        } else {
                            pages[i].style.zIndex = 13 - i;
                        }
                    }, 50);
                }
            }
            
            // Transition nach Abschluss zurücksetzen
            setTimeout(() => {
                for (let i = 0; i < pages.length; i++) {
                    pages[i].style.transition = 'transform 1s ease';
                }
            }, 1000);
        }

    </script>
